apiVersion: v1
kind: Service
metadata:
  name: todo-frontend
  labels:
    app: todo-frontend
spec:
  selector:
    app: todo-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend
  labels:
    app: todo-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: todo-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: todo-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull # same Secret as the backend, already in todo-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the `node` user of the node images
      containers:
        - name: app
          image: ghcr.io/renteadan/todo-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: BACKEND_URL # read server-side by the signup Server Action
              value: http://todo-backend
            - name: BACKEND_PUBLIC_URL # the browser opens its socket.io connection here
              value: https://api.home.renteadan.com
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-frontend
spec:
  # Caddy (docker-stacks) terminates TLS for todo.home.renteadan.com and forwards to Traefik, which routes here by Host.
  ingressClassName: traefik
  rules:
    - host: todo.home.renteadan.com
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: todo-frontend, port: { name: http } } } }] }
