apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shares the backend's namespace; backend/k8s owns the Namespace object itself.
namespace: todo-app

resources:
- app.yaml

# Starting tag only. Argo CD Image Updater (docker-stacks, k8s/argocd-image-updater/)
# sets the newest sha-* build on the Application, which overrides this.
images:
- name: ghcr.io/renteadan/todo-frontend
  newName: ghcr.io/renteadan/todo-frontend
  newTag: sha-8a65606
