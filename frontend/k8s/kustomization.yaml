apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shares the backend's namespace; backend/k8s owns the Namespace object itself.
namespace: todo-app

resources:
- app.yaml

# Set by the "Frontend" workflow after each build on main (`kustomize edit set image`).
images:
- name: ghcr.io/renteadan/todo-frontend
  newName: ghcr.io/renteadan/todo-frontend
  newTag: sha-efd8e0c
