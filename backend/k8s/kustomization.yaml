apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: todo-app

resources:
- namespace.yaml
- postgres.yaml
- redis.yaml
- app.yaml

# The Secrets `postgres-credentials` and `todo-backend-env` are not in git: they
# are created by hand with kubectl (README.md), and Argo CD leaves them alone.

# Set by the "Docker images" workflow after each build on main
# (`kustomize edit set image`): Argo CD deploys whatever tag is committed here.
images:
- name: ghcr.io/renteadan/todo-backend
  newName: ghcr.io/renteadan/todo-backend
  newTag: sha-9a80754
