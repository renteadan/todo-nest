apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: todo-app

resources:
- namespace.yaml
- postgres.yaml
- redis.yaml
- app.yaml

# The Secrets `postgres-credentials` and `todo-backend-env` are not in git: they
# are created by hand with kubectl (README.md), and Argo CD leaves them alone.

# Starting tag only. Argo CD Image Updater (docker-stacks, k8s/argocd-image-updater/)
# sets the newest sha-* build on the Application, which overrides this.
images:
- name: ghcr.io/renteadan/todo-backend
  newName: ghcr.io/renteadan/todo-backend
  newTag: sha-6446137
