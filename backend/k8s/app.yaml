apiVersion: v1
kind: Service
metadata:
  name: todo-nest
  labels:
    app: todo-backend
spec:
  # Pinned so Nginx Proxy Manager can forward api.renteadan.com straight to it
  # (no ingress controller: Traefik is disabled in k3s). Must stay inside the
  # cluster's service CIDR (10.43.0.0/16) and can't change without recreating
  # the Service.
  clusterIP: 10.43.115.124
  selector:
    app: todo-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  labels:
    app: todo-backend
spec:
  replicas: 1
  revisionHistoryLimit: 2 # old ReplicaSets kept for `kubectl rollout undo`
  selector:
    matchLabels:
      app: todo-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      # For a private GHCR package (see README). Ignored if the secret doesn't exist.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the `node` user of the node images
      # The container applies pending migrations before starting the API (see
      # the Dockerfile's CMD); the startupProbe below allows time for both.
      containers:
        - name: app
          image: ghcr.io/renteadan/todo-nest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            # DATABASE_URL, JWT_SECRET, OBSERVE_APP_KEY, OBSERVE_APP_SECRET (Secret created by hand, see README.md)
            - secretRef:
                name: todo-backend-env
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 90 # 3 minutes: migrations run first
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            # On this node (Ubuntu 26.04), processes in a container end up with
            # two AppArmor labels (cri-containerd.apparmor.d and
            # cri-containerd.apparmor.d//&unconfined), and the containerd profile
            # denies signals between them. Prisma's migrate step then logs
            # "kill EACCES" when it stops its schema engine.
            appArmorProfile:
              type: Unconfined
