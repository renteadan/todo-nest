# Plain HTTP: Traefik listens on the host's port 10080 (cluster/traefik-config.yaml),
# and Nginx Proxy Manager in front terminates HTTPS and proxies the domain here
# (see README.md). It forwards the Host header, so the rule matches.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-nest
spec:
  ingressClassName: traefik # bundled with k3s
  rules:
    - host: api.renteadan.com # same as the proxy host in Nginx Proxy Manager
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-nest
                port:
                  name: http
