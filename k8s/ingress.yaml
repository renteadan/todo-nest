# Plain HTTP: Traefik listens on the host's port 9090 (cluster/traefik-config.yaml),
# and nginx in front terminates HTTPS and proxies the domain here
# (nginx/todo-nest.conf). nginx forwards the Host header, so the rule matches.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-nest
spec:
  ingressClassName: traefik # bundled with k3s
  rules:
    - host: api.example.com # TODO: your domain (same as server_name in nginx)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-nest
                port:
                  name: http
