apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Start as the image's postgres user (uid/gid 999) instead of root, so
      # docker-entrypoint.sh skips its gosu step: gosu 1.20 hangs at 100% CPU
      # on this node (kernel 7.0, Ubuntu 26.04) and never execs postgres.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB (Secret created by hand, see README.md)
            - secretRef:
                name: postgres-credentials
          env:
            # A subdirectory, so the volume's lost+found doesn't block initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # The first start runs initdb, which can take minutes on a slow disk.
          # Liveness only starts after this succeeds: a restart in the middle
          # of initdb leaves a half-initialized data directory behind.
          startupProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 60 # 5 minutes
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # k3s ships the local-path provisioner as its default storage class:
        # the data lives on the node's disk, under /var/lib/rancher/k3s/storage.
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
