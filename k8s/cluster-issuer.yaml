# Cluster-wide, so it is applied once on its own (after cert-manager is
# installed), not through kustomization.yaml. See README.md.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com # TODO: expiry notices from Let's Encrypt go here
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
