# nginx site for the API: HTTPS here, then plain HTTP to Traefik on port 9090.
# Copy to /etc/nginx/sites-available/todo-nest, link it into sites-enabled,
# and replace api.example.com and <server-ip>. See k8s/README.md.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # certbot's HTTP challenge, then everything else to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # Written by `certbot certonly --webroot -w /var/www/html -d api.example.com`.
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    location / {
        # The server's own LAN IP, not 127.0.0.1: k3s exposes 9090 through
        # iptables port mapping, which doesn't reliably answer on loopback.
        proxy_pass http://<server-ip>:9090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
