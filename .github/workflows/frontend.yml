name: Frontend

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Manifest-only changes need no new images (Argo CD syncs them directly).
    # Later patterns win: frontend code changes trigger a build, but manifest/doc-only changes don't.
    paths:
      - "frontend/**"
      - "!frontend/k8s/**"
      - "!**.md"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/todo-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Pins the image just built in frontend/k8s/kustomization.yaml and commits it;
  # Argo CD sees the commit and rolls out. Commits made with GITHUB_TOKEN
  # don't trigger workflows, so this doesn't loop.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-main
    steps:
      - uses: actions/checkout@v7

      - uses: imranismail/setup-kustomize@v3

      - name: Pin image tag
        working-directory: frontend/k8s
        run: |
          tag="sha-${GITHUB_SHA::7}" # the tag docker/metadata-action's type=sha produces
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          kustomize edit set image "ghcr.io/${owner}/todo-frontend=ghcr.io/${owner}/todo-frontend:${tag}"

      - name: Commit and push
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(frontend): ${GITHUB_SHA::7}"
          # main may have moved while the images built.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
