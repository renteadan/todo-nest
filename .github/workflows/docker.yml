name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Manifest-only changes need no new images (Argo CD syncs them directly).
    paths-ignore:
      - "k8s/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: runtime
            image: ghcr.io/${{ github.repository_owner }}/todo-nest
          - target: migrate
            image: ghcr.io/${{ github.repository_owner }}/todo-nest-migrate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # Pins the images just built in k8s/kustomization.yaml and commits it;
  # Argo CD sees the commit and rolls out. Commits made with GITHUB_TOKEN
  # don't trigger workflows, so this doesn't loop.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-main
    steps:
      - uses: actions/checkout@v4

      - uses: imranismail/setup-kustomize@v2

      - name: Pin image tags
        working-directory: k8s
        run: |
          tag="sha-${GITHUB_SHA::7}" # the tag docker/metadata-action's type=sha produces
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          kustomize edit set image \
            "ghcr.io/${owner}/todo-nest=ghcr.io/${owner}/todo-nest:${tag}" \
            "ghcr.io/${owner}/todo-nest-migrate=ghcr.io/${owner}/todo-nest-migrate:${tag}"

      - name: Commit and push
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: ${GITHUB_SHA::7}"
          # main may have moved while the images built.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
