name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # src/generated/prisma is gitignored.
      - run: npx prisma generate --config prisma7.config.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The frontend has no unit tests yet; format, lint and build (type-check) are the gate.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Browser tests (e2e/) against the whole stack, as docker compose runs it.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      # Compose reads JWT_SECRET from backend/.env, which is not committed.
      - run: echo "JWT_SECRET=ci-$(openssl rand -hex 32)" > ../backend/.env
      - run: docker compose up --build --detach
      # The backend applies migrations before it listens; wait for both apps.
      - run: |
          for i in $(seq 90); do
            curl -sf http://localhost:3001/health/ready > /dev/null \
              && curl -sf -o /dev/null http://localhost:3000/login && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
